apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    resources:
    - group: ""
      resources: ["pods"]
    verbs: ["create"]
    namespaces: ["audit-zone"]

  - level: Metadata
    resources:
    - group: ""
      resources: ["namespaces"]
    verbs: ["update", "patch"]

  - level: RequestResponse
    resources:
    - group: "constraints.gatekeeper.sh"
      resources: ["*"]
    verbs: ["create", "update"]

  - level: Request
    omitStages:
      - "RequestReceived"
    userGroups: ["system:authenticated"]
    verbs: ["create", "update"]
    resources:
    - group: ""
    - group: "apps"
    - group: "batch"
    resources: ["*"]