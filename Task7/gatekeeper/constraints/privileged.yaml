apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sProhibitedPrivileged
metadata:
  name: prohibit-privileged-containers
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "audit-zone"
  parameters:
    message: "Privileged containers are prohibited in audit-zone namespace"