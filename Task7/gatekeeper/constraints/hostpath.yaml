apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sProhibitedHostPath
metadata:
  name: prohibit-hostpath-volumes
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "audit-zone"
  parameters:
    message: "hostPath volumes are prohibited in audit-zone namespace"