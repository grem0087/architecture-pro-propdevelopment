apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sprohibitedprivileged
spec:
  crd:
    spec:
      names:
        kind: K8sProhibitedPrivileged
      validation:
        openAPIV3Schema:
          properties:
            message:
              type: string
              default: "Privileged containers are not allowed"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package prohibitedprivileged

        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            container.securityContext.privileged == true
            msg := sprintf("Privileged container %v is not allowed", [container.name])
        }

        violation[{"msg": msg}] {
            container := input.review.object.spec.initContainers[_]
            container.securityContext.privileged == true
            msg := sprintf("Privileged initContainer %v is not allowed", [container.name])
        }