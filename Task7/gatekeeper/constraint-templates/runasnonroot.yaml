apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredrunasnonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredRunAsNonRoot
      validation:
        openAPIV3Schema:
          properties:
            message:
              type: string
              default: "Containers must run as non-root users"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requiredrunasnonroot

        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            not container.securityContext.runAsNonRoot
            msg := sprintf("Container %v must have runAsNonRoot set to true", [container.name])
        }

        violation[{"msg": msg}] {
            container := input.review.object.spec.initContainers[_]
            not container.securityContext.runAsNonRoot
            msg := sprintf("initContainer %v must have runAsNonRoot set to true", [container.name])
        }

        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            container.securityContext.runAsNonRoot == false
            msg := sprintf("Container %v must have runAsNonRoot set to true", [container.name])
        }