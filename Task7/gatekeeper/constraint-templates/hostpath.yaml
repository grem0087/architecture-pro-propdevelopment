apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sprohibitedhostpath
spec:
  crd:
    spec:
      names:
        kind: K8sProhibitedHostPath
      validation:
        openAPIV3Schema:
          properties:
            message:
              type: string
              default: "hostPath volumes are not allowed"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package prohibitedhostpath

        violation[{"msg": msg}] {
            volume := input.review.object.spec.volumes[_]
            volume.hostPath
            msg := sprintf("hostPath volume %v is not allowed", [volume.name])
        }